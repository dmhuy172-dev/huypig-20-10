
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff8fa">
  <meta name="description" content="^^">
  <title>^^</title>

  <link rel="stylesheet" href="./style.css">

  <script src="./script.js" defer></script>
  <script src="./card.js" defer></script>
</head>

<body>
  <main>
    <a class="garden-link" href="./garden.html">
      Hoa cho em
      <span aria-hidden="true">❀</span>
    </a>

    <canvas id="ambientPetalsCanvas" aria-hidden="true"></canvas>

    <header class="greeting">
      <p class="occasion">
        Chúc mừng ngày hôm nay ngày phụ nữ Việt Nam <span>20/10</span>
      </p>

      <h1>Gửi nhỏ một bó hoa nhỏ,<br> ngàn lời yêu thương.</h1>

      <p class="greeting-caption">
        Không chỉ hôm nay mong mỗi ngày em nhỏ thật dịu dàng.
      </p>
    </header>

    <div class="gift-layout">
      <section
        class="scene-column"
        aria-label="Hoa và những lời chúc 20/10"
      >
        <div class="gift-visuals">
          <div class="bouquet-composition">
            <div
              id="bouquetStageWrapper"
              role="button"
              tabindex="0"
              aria-label="Bó hoa hồng. Nhấn Enter để nhận lời chúc; dùng phím mũi tên để chọn bông hoa."
              aria-describedby="bouquetHint"
            >
              <canvas id="bouquetCanvas" aria-hidden="true"></canvas>
            </div>

            <button
              class="envelope-button"
              id="openCard"
              type="button"
              aria-haspopup="dialog"
              aria-controls="greetingCard"
              aria-expanded="false"
              hidden
            >
              <span class="envelope" aria-hidden="true">
                <span class="envelope-letter">Gửi bạn</span>
                <span class="envelope-seal">♡</span>
              </span>

              <span class="envelope-caption">
                Có một tấm thiệp cho Thanh Hải

              <span class="envelope-action">Mở thiệp</span>
            </button>
          </div>
        </div>

        <footer class="scene-footer">
          <p id="bouquetHint" class="bouquet-hint">
            Chạm mỗi bông hoa để nhận lời chúc
          </p>

          <p
            id="roseWish"
            class="rose-wish"
            role="status"
            aria-live="polite"
            aria-atomic="true"
          ></p>
        </footer>
      </section>

      <!-- Thiệp chúc mừng 20/10 -->
      <dialog
        id="greetingCard"
        class="card-dialog"
        aria-labelledby="cardTitle"
      >
        <div class="letter-paper">
          <button
            class="close-button"
            id="closeCard"
            type="button"
            aria-label="Đóng thiệp"
          >×</button>

          <div id="cardReading">
            <div class="letter-date" aria-label="Ngày 20 tháng 10">
              <span>20</span>
              <span class="date-stem" aria-hidden="true"></span>
              <span>10</span>
            </div>

            <p class="letter-recipient">
              Gửi <span id="cardRecipient">bạn</span>,
            </p>

            <h2 id="cardTitle">
              Chúc em một ngày<br>thật nhiều hạnh phúc.
            </h2>

            <div class="letter-flower" aria-hidden="true">❀</div>

            <p id="cardMessage" class="letter-message"></p>

            <div class="letter-signoff">
              <p>Với thật nhiều thương mến,</p>
              <p id="cardSender" class="letter-signature"></p>
            </div>

            <div class="letter-fold" aria-hidden="true"></div>
          </div>

          <p
            id="cardStatus"
            class="card-status"
            role="status"
            aria-live="polite"
          ></p>
        </div>
      </dialog>
    </div>

    <noscript>
      <p class="noscript-message">
        Bật JavaScript để ngắm hoa nở và mở thiệp 20/10 nhé.
      </p>
    </noscript>
  </main>

  <!-- Hiệu ứng trang trí bổ sung -->
  <script src="./enhancements.js"></script>

  <!-- Hiển thị lời chúc khi chọn bông hoa -->
  <script>
    document.addEventListener('bouquet:rose', function (event) {
      const roseWish = document.getElementById('roseWish');
      const message = event.detail && event.detail.message;

      if (!roseWish || !message) return;

      roseWish.textContent = message;
      roseWish.classList.remove('wish-visible');

      // Khởi động lại hiệu ứng khi chọn bông hoa khác
      void roseWish.offsetWidth;
      roseWish.classList.add('wish-visible');
    });
  </script>
</body>
</html>
